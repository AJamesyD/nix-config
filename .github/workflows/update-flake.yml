name: Update flake inputs

on:
  schedule:
    - cron: '0 0 * * *' # Daily midnight UTC
  workflow_dispatch:

# All writes use secrets.PAT; GITHUB_TOKEN is intentionally unprivileged.
permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # WORKAROUND: update-flake-lock has no `exclude-inputs` option.
      #   Build the input list dynamically, excluding unreachable private inputs.
      #   Revisit when https://github.com/DeterminateSystems/update-flake-lock/issues/246 lands.
      - id: inputs
        run: |
          list=$(nix flake metadata --json | jq -r '.locks.nodes.root.inputs | keys[] | select(. != "amzn-community")' | xargs)
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # PAT used instead of GITHUB_TOKEN: PRs it creates don't trigger CI,
      # so required checks never pass and auto-merge never fires.
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        id: update
        with:
          inputs: ${{ steps.inputs.outputs.list }}
          token: ${{ secrets.PAT }}
          pr-title: 'chore: update flake inputs'
          pr-labels: |
            dependencies
            automated

      # Requires branch protection on main:
      #   - Required status check: "check" (from build.yml)
      #   - "Do not allow bypassing" enabled
      # PAT expires annually. If this step 401s, rotate at:
      #   Settings > Secrets and variables > Actions > PAT
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: gh pr merge ${{ steps.update.outputs.pull-request-number }} --auto --rebase --repo ${{ github.repository }}
