name: Update flake inputs

on:
  schedule:
    # NOTE: daily 00:17 UTC. Off the hour because GitHub may drop scheduled runs queued at :00.
    - cron: '17 0 * * *'
  workflow_dispatch:

# NOTE: all writes use secrets.PAT; GITHUB_TOKEN is intentionally unprivileged.
permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # HACK: update-flake-lock has no `exclude-inputs` option.
      # Build the input list dynamically, excluding unreachable private inputs.
      # Revisit when https://github.com/DeterminateSystems/update-flake-lock/issues/246 lands.
      - id: inputs
        shell: bash
        run: |
          list=$(nix flake metadata --json | jq -r '.locks.nodes.root.inputs | keys[] | select(. != "amzn-community")' | xargs)
          # NOTE: an empty list makes update-flake-lock update every input, including amzn-community.
          [ -n "$list" ] || { echo "error: empty input list" >&2; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # NOTE: PAT used instead of GITHUB_TOKEN because PRs created with
      # GITHUB_TOKEN don't trigger CI, so required checks never pass and
      # auto-merge never fires.
      # WARN: PAT expires annually. If this workflow 401s, rotate at
      # Settings > Secrets and variables > Actions > PAT.
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        id: update
        with:
          inputs: ${{ steps.inputs.outputs.list }}
          token: ${{ secrets.PAT }}
          pr-title: 'chore: update flake inputs'
          pr-labels: |
            dependencies
            automated

      # NOTE: requires repo setting "Allow auto-merge" and branch protection on main:
      # - Required status check: "check" (from build.yml)
      # - "Do not allow bypassing" enabled
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --rebase --repo "$GITHUB_REPOSITORY"
