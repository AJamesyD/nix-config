name: Build and cache

on:
  push:
    branches: [main]
    # NOTE: only build-inert files: docs, CI config (except self), git metadata.
    #   Everything else may affect nix build output (via readFile, home.file, etc).
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.github/workflows/update-flake.yml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.sops.yaml'
      - 'LICENSE'
  # NOTE: no paths-ignore on PRs. A workflow skipped by path filters never
  # reports the required `check` status, so the PR can't merge.
  pull_request:
    branches: [main]
  schedule:
    # NOTE: Monday 06:23 UTC. Used random off-the-hour offset because GitHub may drop scheduled runs queued at :00.
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  # NOTE: keyed by PR number (not head_ref) so a fork PR from a branch named
  #   "main" can't share a group with main pushes and cancel their builds.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: m3-work-laptop
            runner: macos-latest
            timeout: 90
            attr: darwinConfigurations.m3-work-laptop.config.system.build.toplevel
          - name: dellangelis-hm
            runner: ubuntu-24.04
            attr: homeConfigurations.dellangelis-hm.activationPackage
          - name: al2-x86-cdd
            runner: ubuntu-24.04
            attr: homeConfigurations.al2-x86-cdd.activationPackage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # NOTE: nix-eval-jobs (run by nix-fast-build) fails on a shallow git+file
          # flake with "'revCount' is not available".
          fetch-depth: 0
          persist-credentials: false

      # NOTE: accept-flake-config trusts flake.nix's nixConfig, which declares
      #   ajamesyd-nix-cache and nix-community as substituters with public keys.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true
            always-allow-substitutes = true
            builders-use-substitutes = true
            max-jobs = auto

      # NOTE: key includes the job so lint's small cache can't claim the key first;
      #   actions/cache never re-saves on an exact key hit.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/nix
          key: nix-eval-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-eval-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ajamesyd-nix-cache
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          skipPush: true

      # NOTE: --inputs-from . takes nix-fast-build from flake.lock's nixpkgs, not
      #   the installer's flake registry, so tool upgrades arrive via flake.lock PRs.
      - name: Build
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          ATTR: ${{ matrix.attr }}
        run: |
          # NOTE: Dependabot and fork PRs can't read Actions secrets, so they build
          # without pushing to Cachix.
          push_args=()
          if [ -n "$CACHIX_AUTH_TOKEN" ]; then
            push_args=(--cachix-cache ajamesyd-nix-cache)
          fi
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --no-nom \
            --skip-cached \
            --option accept-flake-config true \
            --override-input amzn-community path:./ci/stub-amzn-community \
            "${push_args[@]}" \
            --flake "git+file:.#$ATTR"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/nix
          key: nix-eval-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-eval-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting
        run: nix build .#checks.x86_64-linux.treefmt --override-input amzn-community path:./ci/stub-amzn-community

  check:
    if: always()
    needs: [build, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
